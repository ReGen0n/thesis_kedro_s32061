name: kedro run

on:
  push:
  pull_request:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Run pipeline on sample data
        run: kedro run --env=test
      - name: Run full pipeline
        run: kedro run
